[package]
name = "q17"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow = { version = "55", default-features = false }
clap = { version = "4", features = ["derive"] }
bytes = "1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
